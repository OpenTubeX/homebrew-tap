name: Update casks

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag (defaults to the latest stable release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.update.outputs.casks }}
      revision: ${{ steps.update.outputs.revision }}
    steps:
      # Check out the branch as it is now. A queued run's event commit can be outdated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Resolve release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/update.py ${TAG:+"$TAG"}
          casks="$(git diff --name-only -- Casks | jq --raw-input --slurp --compact-output \
            'split("\n") | map(select(length > 0) | ltrimstr("Casks/") | rtrimstr(".rb"))')"
          echo "casks=$casks" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.casks != '[]'
        with:
          name: casks
          path: Casks/

  test:
    needs: prepare
    if: needs.prepare.outputs.casks != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        cask: ${{ fromJSON(needs.prepare.outputs.casks) }}
    runs-on: ${{ matrix.os }}
    env:
      CASK: opentubex/tap/${{ matrix.cask }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: casks
          path: Casks
      - name: Install the candidate casks into the local tap
        run: |
          brew tap opentubex/tap "$GITHUB_WORKSPACE"
          cp Casks/*.rb "$(brew --repository opentubex/tap)/Casks/"
      - run: brew style --cask "$CASK"
      - run: brew install --cask "$CASK"
      - run: bash scripts/test-install.sh

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: casks
          path: Casks
      - name: Publish tested casks in one GitHub-signed commit
        env:
          GH_TOKEN: ${{ github.token }}
          CASKS: ${{ needs.prepare.outputs.casks }}
          TESTED_HEAD: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          # Keep commits that landed during testing unless they touched the casks being published.
          EXPECTED_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TESTED_HEAD}...${EXPECTED_HEAD}" --jq '.files[].filename')"
          if grep --fixed-strings --line-regexp --file=<(jq -r '.[] | "Casks/\(.).rb"' <<< "$CASKS") <<< "$changed"; then
            echo "These casks changed on ${GITHUB_REF_NAME} after they were tested." >&2
            exit 1
          fi
          export EXPECTED_HEAD
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re

          names = {'opentubex': 'OpenTubeX', 'opentubex@nightly': 'OpenTubeX Nightly'}
          additions, versions = [], {}
          for cask in json.loads(os.environ['CASKS']):
              path = f'Casks/{cask}.rb'
              source = Path(path).read_bytes()
              additions.append({'path': path, 'contents': base64.b64encode(source).decode()})
              version = re.search(rb'^  version "([^"]+)"$', source, re.MULTILINE)[1].decode()
              versions.setdefault(version, []).append(names[cask])
          headline = 'chore: update ' + ', '.join(
              f'{" and ".join(casks)} to {version}' for version, casks in versions.items())
          request = {
              'query': 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }',
              'variables': {'input': {
                  'branch': {'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                             'branchName': os.environ['GITHUB_REF_NAME']},
                  'expectedHeadOid': os.environ['EXPECTED_HEAD'],
                  'message': {'headline': headline},
                  'fileChanges': {'additions': additions},
              }},
          }
          Path('commit-request.json').write_text(json.dumps(request))
          PY
          # GitHub signs this commit and rejects it if the branch moved since the check above.
          gh api graphql --input commit-request.json
